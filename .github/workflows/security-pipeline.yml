name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install -r src/requirements.txt

    - name: Run Django unit tests
      run: |
        cd src
        python manage.py test --verbosity=2

  sast-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Bandit and Safety
      run: |
        pip install bandit safety

    - name: Run Bandit SAST scan
      run: |
        bandit -r src/ -f txt || true

    - name: Run Safety dependency check
      run: |
        pip install -r src/requirements.txt
        safety check || true

  nikto-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Nikto
      run: |
        sudo apt-get install -y nikto

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install -r src/requirements.txt

    - name: Start Django server
      run: |
        cd src
        python manage.py migrate
        python manage.py runserver &
        sleep 5

    - name: Run Nikto scan
      run: |
        nikto -h http://127.0.0.1:8000 -output nikto-report.txt || true

    - name: Upload Nikto report
      uses: actions/upload-artifact@v3
      with:
        name: nikto-report
        path: nikto-report.txt

  pipeline-complete:
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-scan]
    steps:
    - name: Pipeline complete
      run: echo "DevSecOps pipeline completed successfully!"